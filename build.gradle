plugins {
    id 'java'
    id 'maven-publish'
}

group = 'com.sparrowwallet'
version = '1.0.6'

def secrets = new Properties()
file("publish.properties").withInputStream {
    stream -> secrets.load(stream)
}

repositories {
    mavenCentral()
}

java {
    withSourcesJar()
}

dependencies {
    implementation('com.fasterxml.jackson.core:jackson-databind:2.21.8')
    implementation('org.eclipse.jetty:jetty-client:12.1.15')
    implementation('io.reactivex.rxjava2:rxjava:2.2.21')
    implementation('org.apache.commons:commons-lang3:3.20.0')
    implementation('org.slf4j:slf4j-api:2.0.17')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.14.1')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.14.1')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
}

publishing {
    repositories {
        maven {
            name = "Forgejo-SparrowWallet"
            url = uri("https://code.sparrowwallet.com/api/packages/sparrowwallet/maven")

            credentials(HttpHeaderCredentials) {
                name = "Authorization"
                value = "token ${secrets.token}"
            }

            authentication {
                header(HttpHeaderAuthentication)
            }
        }
    }

    publications {
        maven(MavenPublication) {
            artifactId = 'tern'

            from components.java
        }
    }
}