plugins {
    id 'java'
    id 'com.vanniktech.maven.publish' version '0.35.0'
}

repositories {
    mavenCentral()
}

dependencies {
    implementation('com.fasterxml.jackson.core:jackson-databind:2.21.8')
    implementation('org.eclipse.jetty:jetty-client:12.1.15')
    implementation('io.reactivex.rxjava2:rxjava:2.2.21')
    implementation('org.apache.commons:commons-lang3:3.20.0')
    implementation('org.slf4j:slf4j-api:2.0.17')
    testImplementation('org.junit.jupiter:junit-jupiter-api:5.14.1')
    testRuntimeOnly('org.junit.jupiter:junit-jupiter-engine:5.14.1')
    testRuntimeOnly('org.junit.platform:junit-platform-launcher')
}

test {
    useJUnitPlatform()
}

// Reproducible archives: no timestamps, a fixed entry order, and fixed entry modes, so a rebuild of a tagged commit reproduces the published jar.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    filePermissions { unix('rw-r--r--') }
    dirPermissions { unix('rwxr-xr-x') }
}
